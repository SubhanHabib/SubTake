<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SubTake · Storyboard</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#202431;font:14px -apple-system,BlinkMacSystemFont,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #dce0e9;border-radius:9px;background:white;padding:10px 14px;color:#303648;font-weight:600}button:hover{background:#eef2fc}button:disabled{opacity:.45;cursor:default}.primary{background:#2863ec;color:white;border-color:#2863ec}.primary:hover{background:#1c50ca}header{height:76px;background:white;border-bottom:1px solid #e3e6ef;display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:16px}.brand{font-size:19px;letter-spacing:-.6px;font-weight:750}.tag{font-size:11px;color:#687287;background:#f0f2f8;border-radius:5px;padding:4px 6px;margin-left:10px;font-weight:500}.tabs{display:flex;background:#eef0f5;padding:4px;border-radius:10px}.tabs button{border:0;background:transparent;padding:8px 16px}.tabs .selected{background:white;box-shadow:0 1px 4px #1111}.actions{display:flex;gap:8px;align-items:center}main{max-width:1500px;margin:auto;padding:28px 30px}.intro{display:flex;align-items:start;justify-content:space-between;gap:20px;margin-bottom:24px}h1{font-size:27px;font-weight:650;letter-spacing:-.7px;margin:0 0 8px}p{line-height:1.5;margin:6px 0;color:#687287}.meta{color:#697386;font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-content:start}.scene{padding:0;text-align:left;border-radius:14px;overflow:hidden;background:white;border:2px solid transparent;box-shadow:0 2px 12px #20243108;font-weight:400}.scene.active{border-color:#2863ec}.scene img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#171c35}.scene .body{padding:15px}.scene h3{margin:6px 0;font-size:16px}.scene p{font-size:13px;min-height:38px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.chip{font-size:11px;background:#f0f3f9;color:#536279;border-radius:5px;padding:4px 7px}aside{background:white;border:1px solid #e3e6ef;border-radius:14px;padding:20px;align-self:start}aside h2{font-size:17px;margin:0 0 20px}label{display:block;font-size:12px;color:#586377;margin:14px 0 7px}input,textarea,select{width:100%;border:1px solid #dce0e9;border-radius:8px;padding:10px;background:#fafbfe;color:#202431}textarea{resize:vertical;min-height:66px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.notice{border-radius:10px;background:#edf3ff;padding:12px 16px;margin-bottom:18px;color:#244c9a}.error{background:#fff0ed;color:#aa3525}.empty{background:white;padding:50px;border-radius:14px;grid-column:1/-1}.brief{background:white;border-radius:14px;padding:26px;max-width:1000px;margin:auto;border:1px solid #e3e6ef}.brief pre{white-space:pre-wrap;font:15px/1.7 inherit}.asset-list{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}.asset-list img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#171c35;border-radius:9px}video{width:100%;max-height:65vh;border-radius:14px;background:#171c35}.preview{max-width:1100px;margin:auto}.progress{padding:25px;background:white;border-radius:14px}.spinner{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid #a8bef6;border-top-color:#2863ec;animation:spin .8s linear infinite;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}details{margin-top:18px}summary{cursor:pointer;color:#687287}.feedback-list{max-height:160px;overflow:auto;font-size:12px}.foot{margin-top:22px;font-size:12px;color:#7b8393}@media(max-width:950px){header{height:auto;min-height:76px;flex-wrap:wrap;padding:15px}.layout{grid-template-columns:1fr}main{padding:20px}.cards{grid-template-columns:repeat(2,1fr)}aside{max-width:none}.asset-list{grid-template-columns:1fr 1fr}}@media(max-width:560px){.cards{grid-template-columns:1fr}.intro{display:block}.brand .tag{display:none}.actions button{font-size:12px;padding:9px}.tabs button{padding:8px}.asset-list{grid-template-columns:1fr}}
</style></head><body>
<header><div class="brand">SubTake<span class="tag">AGENT VIDEO</span></div><nav class="tabs" aria-label="Workspace"><button data-tab="brief">Brief</button><button data-tab="story" class="selected">Storyboard</button><button data-tab="preview">Preview</button></nav><div class="actions"><button id="approve">Approve story</button><button class="primary" id="build">Generate draft</button></div></header>
<main><div id="notice" role="status" hidden></div><div id="content"></div></main>
<script>
const token=new URLSearchParams(location.search).get('token');
let current=null, tab='story', selected=0, dirty=false, advanced=false;
const content=document.getElementById('content'),notice=document.getElementById('notice');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const media=path=>'/media?token='+encodeURIComponent(token)+'&path='+encodeURIComponent(path);
function message(text,error=false){notice.hidden=!text;notice.className='notice'+(error?' error':'');notice.textContent=text;}
async function post(path,body){const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error);return data;}
async function refresh(){try{const r=await fetch('/api/state?token='+encodeURIComponent(token));if(!r.ok)throw Error('Open the board using its launch command');const data=await r.json();if(dirty){if(data.revision!==current.revision)message('The agent updated this story. Save will check for conflicts; reload to use its revision.');return;}const changed=JSON.stringify(data)!==JSON.stringify(current);current=data;if(changed)render();}catch(e){message(e.message,true);}}
function render(){
 const p=current.plan, scenes=p.scenes, approved=current.approved_revision===current.revision,busy=current.job?.status==='running';
 document.getElementById('approve').disabled=dirty||busy||!scenes.length||approved;
 document.getElementById('approve').textContent=approved?'Story approved':'Approve story';
 document.getElementById('build').disabled=dirty||busy||!approved;
 document.getElementById('build').textContent=busy?'Generating…':current.engine==='hyperframes'?'Generate preview':'Generate draft';
 document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('selected',b.dataset.tab===tab));
 if(tab==='brief'){
 content.innerHTML=`<div class="brief"><h1>Your source material</h1><p>The agent uses this brief and the selected media. No other apps or chats are read automatically.</p><pre>${esc(current.brief)}</pre><div class="asset-list">${current.assets.map(a=>`<div><img src="${media(a.poster)}" alt="${esc(a.name)}"><p>${esc(a.name)}</p><span class="meta">${esc(a.id)} · ${a.width} × ${a.height} · ${a.kind==='image'?'Still image':a.duration.toFixed(1)+'s recording'}</span></div>`).join('')}</div></div>`;
 }else if(tab==='preview'){
 const b=current.build;
 if(b?.engine==='hyperframes'){
 content.innerHTML=`<div class="preview" style="max-width:none"><div class="intro"><div><h1>${esc(p.title)}</h1><p>Live composition · HyperFrames ${esc(b.version)} · revision ${b.revision}</p></div><div class="actions"><button id="timeline">${advanced?'Back to preview':'Edit timeline'}</button><button id="reload-preview">Refresh preview</button><button id="export" class="primary" ${busy||b.revision!==current.revision||!approved?'disabled':''}>Approve & export</button></div></div>${busy?'<p class="notice">'+esc(current.job.message)+'</p>':''}${current.job?.status==='failed'?'<p class="notice error">'+esc(current.job.message)+'</p>':''}<iframe title="Live HyperFrames editor" src="${esc(advanced?b.preview_url:(b.player_url||b.preview_url))}" style="width:100%;height:calc(100vh - 270px);min-height:450px;border:1px solid #ddd;border-radius:16px" allow="autoplay" sandbox="allow-scripts allow-same-origin allow-downloads"></iframe><p class="foot">Play, scrub and revise before rendering. Refresh after Studio edits before approving export. ${current.export?'<a href="'+media(current.export)+'" download="subtake-video.mp4">Latest exported movie</a>':''}</p></div>`;
 document.getElementById('timeline').onclick=()=>{advanced=!advanced;render();};
 document.getElementById('reload-preview').onclick=()=>act(async()=>{current=await post('refresh-preview',{});render();});
 document.getElementById('export').onclick=()=>act(async()=>{await post('export',{revision:current.revision,source_sha256:b.source_sha256});await refresh();});
 }else{
 content.innerHTML=`<div class="preview"><div class="intro"><div><h1>${esc(p.title)}</h1><p>${b?'Generated draft · revision '+b.revision:'Generate your approved story to see the video here.'}</p></div>${b?'<button id="open" class="primary">Open in SubTake</button>':''}</div>${busy?'<div class="progress"><span class="spinner"></span>'+esc(current.job.message)+'</div>':''}${b?`<video controls preload="metadata" src="${media(b.preview)}"></video>`:''}${current.job?.status==='failed'?'<p class="notice error">'+esc(current.job.message)+'</p>':''}</div>`;
 document.getElementById('open')?.addEventListener('click',()=>act(async()=>{await post('open',{});message('Opened the generated draft in SubTake.');}));
 }
 }else{
 selected=Math.min(selected,Math.max(0,scenes.length-1));const s=scenes[selected];
 content.innerHTML=`<div class="intro"><div><h1>${esc(p.title)}</h1><p>${esc(p.message)}</p></div><div class="meta">${scenes.length} scenes · ${scenes.reduce((n,s)=>n+s.duration,0)} seconds<br>Revision ${current.revision} · ${approved?'Approved':'Awaiting review'}</div></div>${busy?'<div class="notice"><span class="spinner"></span>'+esc(current.job.message)+'</div>':''}<div class="layout"><div class="cards">${scenes.length?scenes.map((s,i)=>{const a=current.assets.find(a=>a.id===s.asset_id);const poster=current.build?.revision===current.revision?current.build.posters[i]:a.poster;return `<button class="scene ${selected===i?'active':''}" data-scene="${i}"><img src="${media(poster)}" alt="${esc(s.title)}"><div class="body"><div class="row"><span class="meta">SCENE ${i+1} · ${s.duration}s</span><span class="chip">${a.kind==='image'?'Screenshot':'Recording'}</span></div><h3>${esc(s.title)}</h3><p>${esc(s.purpose)}</p></div></button>`}).join(''):'<div class="empty"><h1>Ready for a storyline</h1><p>Ask your agent to read the SubTake storyboard skill, inspect these sources, and propose a plan.</p></div>'}</div><aside>${s?`<div class="row"><h2>Scene ${selected+1}</h2><span class="chip">${esc(s.id)}</span></div><label for="title">Scene title</label><input id="title" value="${esc(s.title)}"><label for="purpose">What this scene shows</label><textarea id="purpose">${esc(s.purpose)}</textarea><label for="caption">On-screen caption</label><textarea id="caption">${esc(s.caption||'')}</textarea><label for="narration">Narration script · not synthesised</label><textarea id="narration">${esc(s.narration||'')}</textarea><div class="two"><div><label for="start">Source start · seconds</label><input id="start" type="number" min="0" step=".1" value="${s.start||0}"></div><div><label for="duration">Duration · seconds</label><input id="duration" type="number" min="1" max="20" step=".1" value="${s.duration}"></div></div><div class="form-actions"><button id="save">Save scene</button><button id="earlier" ${selected===0?'disabled':''}>← Earlier</button><button id="later" ${selected===scenes.length-1?'disabled':''}>Later →</button></div><hr style="border:0;border-top:1px solid #eee;margin:22px 0">`:''}<h2>Feedback for your agent</h2><textarea id="feedback" placeholder="Make scene 2 focus on the cursor choices…"></textarea><div class="form-actions"><button id="send">Send feedback</button></div><p class="meta">Then reply in your agent chat so it knows to read the feedback.</p><details><summary>Review history (${current.feedback.length})</summary><div class="feedback-list">${current.feedback.map(f=>'<p>Revision '+f.revision+': '+esc(f.text)+'</p>').join('')}</div></details></aside></div><p class="foot">Review the story before generating. Earlier generations remain available.</p>`;
 document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{if(dirty)return message('Save this scene before switching.');selected=+b.dataset.scene;render();});
 for(const id of ['title','purpose','caption','narration','start','duration'])document.getElementById(id)?.addEventListener('input',()=>{dirty=true;document.getElementById('approve').disabled=true;document.getElementById('build').disabled=true;});
 document.getElementById('save')?.addEventListener('click',()=>act(async()=>{const plan=structuredClone(current.plan);const s=plan.scenes[selected];for(const key of ['title','purpose','caption','narration'])s[key]=document.getElementById(key).value;for(const key of ['start','duration'])s[key]=+document.getElementById(key).value;current=await post('plan',{plan,revision:current.revision});dirty=false;message('Scene saved. Review the updated story before generating.');render();}));
 for(const [id,delta] of [['earlier',-1],['later',1]])document.getElementById(id)?.addEventListener('click',()=>act(async()=>{if(dirty)throw Error('Save the scene before reordering');const plan=structuredClone(current.plan);[plan.scenes[selected],plan.scenes[selected+delta]]=[plan.scenes[selected+delta],plan.scenes[selected]];current=await post('plan',{plan,revision:current.revision});selected+=delta;render();}));
 document.getElementById('send').onclick=()=>act(async()=>{current=await post('review',{revision:current.revision,action:'feedback',text:document.getElementById('feedback').value});message('Feedback saved. Reply in your agent chat to request the revision.');render();});
 }
}
async function act(fn){try{await fn();}catch(e){message(e.message,true);}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if(dirty)return message('Save your scene first.');tab=b.dataset.tab;render();});
document.getElementById('approve').onclick=()=>act(async()=>{current=await post('review',{revision:current.revision,action:'approve'});message('Story approved. Generate the draft when you’re ready.');render();});
document.getElementById('build').onclick=()=>act(async()=>{await post('build',{revision:current.revision});tab='preview';await refresh();render();});
refresh();setInterval(refresh,2000);
</script></body></html>

[package]
name = "subtake-native"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Native SubTake editor and portable media engine"

[features]
default = ["native-ffmpeg"]
native-ffmpeg = []

[workspace]
members = ["crates/theme", "crates/ui"]
exclude = ["vendor/gpui_macos"]
resolver = "2"

# zui's Metal renderer with SubTake's patches on top (`patches/gpui_macos`).
# `scripts/vendor-gpui.py` makes it from the zui rev below; run it again
# after changing that rev.
[patch."https://github.com/zeronsh/zui"]
gpui_macos = { path = "vendor/gpui_macos" }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# gpui — zeronsh/zui, the fork the Zeron reference renders on. Stock gpui
# 0.2.2 (same version, crates.io) lacks two fixes window glass needs:
#   f596cde — destination alpha on transparent windows (Porter-Duff OVER,
#             not additive), without which translucent chrome renders
#             see-through instead of tinted.
#   8a8954c — macOS blurred view on UnderWindowBackground; macOS 26 stopped
#             vending CABackdropLayer for the Selection material.
# The fork also splits the platform layer out, so `runtime_shaders` and
# `font-kit` are gpui_platform features and the app is built with
# `gpui_platform::application()` rather than `Application::new()`.
gpui = { git = "https://github.com/zeronsh/zui", rev = "c2d273dc3dadcb260b0fa7c35fc2fe02a14f5add" }
gpui_platform = { git = "https://github.com/zeronsh/zui", rev = "c2d273dc3dadcb260b0fa7c35fc2fe02a14f5add", features = [
    "font-kit",
    "runtime_shaders",
] }
subtake-theme = { path = "crates/theme" }
subtake-ui = { path = "crates/ui" }
smallvec = "1"
async-channel = "2"
futures-lite = "2"
env_logger = "0.11"
# Cursor artwork contains embedded raster images inside SVG files.
resvg = { version = "0.45", default-features = false, features = ["raster-images"] }
rfd = "0.16"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
skia-safe = { version = "0.99", features = ["textlayout", "svg", "gl"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
crossbeam-channel = "0.5"
directories = "6"
global-hotkey = "0.7"
base64 = "0.22"
url = "2"
raw-window-handle = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
rodio = { version = "0.21", default-features = false, features = ["playback"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-metal = "0.3"
skia-safe = { version = "0.99", features = ["metal"] }

[build-dependencies]
cc = "1"

# A development build is what `scripts/dev.py` installs, and gpui re-lays-out
# the whole window through taffy on every frame — a hover fade is ~9 full
# layouts. Unoptimised, that engine is slow enough to feel in the hand, so
# dependencies build optimised while our own crates stay quick to recompile.
# The zui fork's own workspace does the same (`taffy = { opt-level = 3 }`);
# its profiles do not reach us, because only the root workspace's apply.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.taffy]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[package]
name = "subtake-native"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Native SubTake editor and portable media engine"

[features]
default = ["native-ffmpeg"]
native-ffmpeg = []

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "=1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-skia", "compat-1-2", "accessibility", "raw-window-handle-06", "unstable-winit-030"] }
rfd = "0.16"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
skia-safe = { version = "0.99", features = ["textlayout", "svg"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
crossbeam-channel = "0.5"
directories = "6"
global-hotkey = "0.7"
base64 = "0.22"
url = "2"
raw-window-handle = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
rodio = { version = "0.21", default-features = false, features = ["playback"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-metal = "0.3"
skia-safe = { version = "0.99", features = ["metal"] }

[build-dependencies]
cc = "1"
slint-build = "=1.17.1"

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
# Inject the same gesture events as winit in native UI regression tests.
i-slint-core = { version = "=1.17.1", default-features = false }
